name: Discord Bot Webhook

on:
  workflow_dispatch:
    inputs:
      botId:
        description: 'ID of the bot to send manually'
        required: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: discord-bot
  cancel-in-progress: false

jobs:
  process-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Processor
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MANUAL_BOT_ID: ${{ github.event.inputs.botId }}
        run: node .github/scripts/discord-bot.mjs

      - name: Commit Database Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add database.json
          if git diff --staged --quiet; then
            echo "No changes to database.json"
            exit 0
          fi
          git commit -m "Bot: Status Update [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing and retrying..."
            sleep 5
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "Push failed after 3 attempts"
          exit 1
